<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
    
<body>
    <div class="container">
        <div class="card">
            <h2>Department List</h2>
            <a class="btn btn-blue" href="{% url 'department_create' %}">Add Department</a>
            <table border="1">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Code</th>
                    <th>Actions</th>
                </tr>

                {% for i in data %}
                <tr>
                    <td>{{ i.dept_id }}</td>
                    <td>{{ i.dept_name }}</td>
                    <td>{{ i.dept_code }}</td>
                    <td>
                        
                            <a class="btn btn-green" href="{% url 'department_update' i.id %}">Edit</a>
                            <a class="btn btn-orange" href="{% url 'department_delete' i.id %}">Delete</a>
                       
                    </td>
                </tr>
                {% endfor %}
            </table>

            <a class="btn btn-blue" href="{% url 'home' %}">Home</a>
        </div>
    </div>
</body>
</html>

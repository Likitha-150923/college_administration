<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
   
<body>
    <div class="container">
        <div class="card">
            <h2>Student List</h2>
            
            
            <a href="{% url 'student_create' %}" class="btn btn-blue">Add Student</a>

            <table >
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Email</th>
                    <th>Class</th>
                    <th>Marks</th>
                    <th>Actions</th>
                </tr>

                {% for i in data %}
                <tr>
                    <td>{{ i.stu_id }}</td>
                    <td>{{ i.stu_name }}</td>
                    <td>{{ i.stu_age }}</td>
                    <td>{{ i.stu_email }}</td>
                    <td>{{ i.stu_class }}</td>
                    <td>{{ i.stu_marks }}</td>
                    <td>
                   <td>
                        <a class="btn btn-green" href="{% url 'student_update' i.id %}">Edit</a>
                        <a class="btn btn-orange" href="{% url 'student_delete' i.id %}">Delete</a>
                    </td>
                    
                </tr>
                {% endfor %}
            </table>

            <a href="{% url 'home' %}" class="btn btn-blue">Home</a>
        </div>
    </div>

</body>
</html>
